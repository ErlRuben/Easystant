<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easystant - History</title>
    <link rel="stylesheet" href="../src/styles/panel.css">
    <link rel="stylesheet" href="../src/styles/history.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="icons/Recon Tech Logo.png" alt="Easystant Logo" class="logo">
            <h1>Easystant</h1>
            <p class="subtitle">History</p>
        </header>

        <div class="history-tabs">
            <button class="history-tab active" data-tab="fixChat">💬 Fix Chat</button>
            <button class="history-tab" data-tab="createTask">✓ Create Task</button>
        </div>

        <div id="history-list" class="history-list">
            <div class="history-loading">Loading history...</div>
        </div>

        <div class="history-footer">
            <button id="back-to-panel" class="back-to-panel-btn">← Back</button>
            <span class="history-note">Last 20 entries kept per tab</span>
        </div>
    </div>

    <script src="../src/features/utils.js"></script>
    <script src="../src/history.js"></script>
</body>
</html>
